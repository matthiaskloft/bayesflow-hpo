[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesflow-hpo"
version = "0.1.0"
description = "Generic hyperparameter optimization for BayesFlow neural posterior estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "matthiaskloft"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "bayesflow>=2.0.0",
    "optuna>=4.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "keras>=3.9,<3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
dashboard = ["optuna-dashboard>=0.14"]
sklearn = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayesflow_hpo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/bayesflow_hpo"]
# The package ships py.typed, so consumers already type-check against it.
# Third-party stubs are the gap: keras, optuna and matplotlib are partially or
# wholly untyped, and demanding stubs for them would only produce ignores.
ignore_missing_imports = true
warn_redundant_casts = true
# `warn_unused_ignores` is deliberately off. Several ignores here are
# version-conditional (optuna's AutoSampler exists only in newer releases), so
# an ignore that is redundant on one supported version is load-bearing on
# another, and the warning would fire on whichever CI happens to install.

# Modules on the metric-name and direction-conversion path. An unannotated
# function here is a hole the planned CanonicalMetricName / raw-vs-minimize
# NewTypes cannot cross (issue #73), so these require full annotations while
# the rest of the package does not.
[[tool.mypy.overrides]]
module = [
    "bayesflow_hpo.objectives",
    "bayesflow_hpo.api",
    "bayesflow_hpo.optimization.objective",
    "bayesflow_hpo.optimization.study",
]
disallow_untyped_defs = true
