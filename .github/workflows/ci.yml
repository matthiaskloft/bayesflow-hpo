name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ scripts/

  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pure stdlib: it reads docs/references.md and src/, and imports
      # nothing from the package, so it needs no backend and no install.
      - run: python scripts/check_citations.py

  docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Also pure stdlib: cross-references are resolved by parsing the
      # source tree, not by importing it, so this needs no backend either.
      - run: python scripts/check_docstrings.py

  types:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]" -c .github/ci-constraints.txt
      # Paths come from [tool.mypy] files in pyproject.toml.
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # [sklearn] as well as [dev]: the whole C2ST suite is behind a
      # `pytest.importorskip("sklearn")`, so without it those tests were
      # silently skipped in CI rather than run. That was tolerable while
      # L-C2ST was reachable only through an explicit factory; it is not
      # now that `lc2st` is a registered objective metric with a direction
      # entry, because the path a study takes to it would have no coverage.
      - run: pip install -e ".[dev,sklearn]" pytest-cov -c .github/ci-constraints.txt
      - run: pytest tests/ -v --cov=bayesflow_hpo --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_not_enabled: false
